name: Deploy portfolio to GitHub Pages

# Publishing requires choosing Run workflow. Pushes and pull requests only run CI.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run assets:prepare
      - run: npm run repo:check
      - run: npm run check
      - name: Build static portfolio
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || 'ntpthaofin.0901@gmail.com' }}
      - run: npm run test:export
      - name: Check the static site
        run: |
          npm start > /tmp/portfolio-preview.log 2>&1 &
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 "http://127.0.0.1:4173${BASE_PATH}/"
          TEST_BASE_URL="http://127.0.0.1:4173${BASE_PATH}" npm test
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
